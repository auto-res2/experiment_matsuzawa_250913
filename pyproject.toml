[project]
name = "cufsf-experiments"
version = "0.1.0"
description = "Refactored CuFSF experimental framework"
requires-python = ">=3.9"

[project.optional-dependencies]
# No optional groups – keep section for extensibility

[tool.setuptools.package-data]
"" = ["*.yaml"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

dependencies = [
  "torch>=1.9.0",
  "torch_geometric>=2.0.0",
  "torch_sparse>=0.6.0",
  "GraphRicciCurvature>=1.5.2",
  "matplotlib>=3.4.0",
  "PyYAML>=5.4",
  "huggingface_hub>=0.14.0",
  "dgl>=0.9.0",
  "numpy>=1.21.0"
]
