[project]
name = "fedc3po"
version = "1.0.0"
description = "FedC3PO: Federated Fair & α-Stable Curvature-Controlled Causal-Probabilistic ODE"
dependencies = [
  "torch>=2.0.0",
  "torch-geometric>=2.3.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "pyyaml>=6.0",
  "huggingface-hub>=0.16.0",
  "ogb>=1.3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.3.0", "black>=23.0.0", "isort>=5.12.0", "flake8>=6.0.0"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
