[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchid-d4"
version = "1.0.0"
description = "ORCHID-D⁴: Orchestrated, Hierarchical, Differentially-private, Distributed Diffusion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ORCHID Research Team", email = "research@orchid-d4.org"}]
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.21.0",
  "matplotlib>=3.5.0",
  "seaborn>=0.12.0",
  "scipy>=1.9.0",
  "pyyaml>=6.0",
  "tqdm>=4.65.0",
  "pillow>=9.0.0",
  "requests>=2.28.0",
  "ortools>=9.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
