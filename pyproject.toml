[project]
name = "orchid-d4"
version = "0.1.0"
description = "ORCHID-D4 research prototype"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "ORCHID Research Team", email = "orchid@example.com"}
]

# ---------------------------------------------------------------------------
# Runtime dependencies.  PEP-621 specifies that these must be provided as an
# *array* under the single key `dependencies`, **not** as a separate table.  The
# previous version used the invalid `[project.dependencies]` table which broke
# TOML parsing.  We switch to the standards-compliant list notation below.
# ---------------------------------------------------------------------------
dependencies = [
  "torch",
  "pyyaml",
  "numpy"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"