[project]
name = "safe_swarm_2"
version = "0.1.0"
description = "Refactored SAFE-Swarm 2.0 experiment suite"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=1.9.0",
  "torchvision>=0.10.0",
  "tqdm>=4.64.0",
  "matplotlib>=3.5.0",
  "requests>=2.26.0",
  "pyyaml>=6.0",
  "datasets>=2.9.0",
  "timm>=0.9.0",
  "numpy>=1.21.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
