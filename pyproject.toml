[project]
name = "forecoast-cl"
version = "0.1.0"
description = "FoReCoast-CL reproducible experiments"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "pyyaml>=6.0",
    "datasets>=2.14.0",
    "Pillow>=9.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
